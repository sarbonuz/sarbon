<title>Sarbon</title>
<style>
:root{--ink:#1B1D45;--mute:#5F6390;--brand:#25308F;--teal:#16A3AE;--pink:#D6246E;--gold:#E9A800;--line:rgba(37,48,143,.12);--r:20px;box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html{background:linear-gradient(165deg,#F1EEFF 0%,#E3F7F5 50%,#FFEAF2 100%) fixed;min-height:100%}

body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(40px);z-index:-1;pointer-events:none}
body::before{width:280px;height:280px;background:rgba(214,36,110,.12);top:-60px;right:-80px}

button,input,select,textarea{font:inherit}
.glass{background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 30px rgba(37,48,143,.10)}
.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:calc(112px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;display:flex;align-items:center;gap:10px;z-index:5;border-radius:0 0 22px 22px}
.logo{flex:1;font-weight:900;font-size:22px;letter-spacing:.3px}
.logo b{color:var(--pink)}.logo span{color:var(--teal)}
.ib{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);color:var(--ink);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;position:relative;cursor:pointer;flex:0 0 42px}
.ib svg{width:21px;height:21px}
.ib i{position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.atlas{position:fixed;top:112px;left:50%;transform:translateX(-50%);width:min(560px,100%);height:5px;z-index:5;background:repeating-linear-gradient(90deg,#D6246E 0 16px,#25308F 16px 32px,#16A3AE 32px 48px,transparent 48px 52px)}
.search{margin:14px 14px 0;border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:8px}
.search input{flex:1;border:0;background:none;color:var(--ink);padding:13px 0;font-size:15px;outline:none}
.banners{display:flex;gap:12px;overflow-x:auto;padding:14px 14px 4px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}

.bn{flex:0 0 88%;scroll-snap-align:start;border-radius:24px;padding:20px;color:#fff;min-height:136px;position:relative;overflow:hidden;background:linear-gradient(120deg,#25308F,#16A3AE);box-shadow:0 10px 26px rgba(37,48,143,.25)}

.bn p{margin:0;font-size:13px;opacity:.92;max-width:80%}

.dots{display:flex;gap:6px;justify-content:center;padding:6px 0 0}

.ai{margin:16px 14px 0;border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border:0;width:calc(100% - 28px);text-align:left;color:var(--ink)}

.sec{font-size:17px;margin:22px 14px 10px;display:flex;justify-content:space-between;align-items:baseline}

.hs{display:flex;gap:12px;overflow-x:auto;padding:0 14px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.card{border-radius:var(--r);overflow:hidden;position:relative;cursor:pointer;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);box-shadow:0 6px 20px rgba(37,48,143,.08)}

.sortbar{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}

.ln{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;color:var(--mute)}

.ln.t{color:var(--ink);font-weight:800;font-size:17px}
.note{font-size:12px;color:var(--mute);padding:4px 0}
.err{color:var(--pink);font-size:13px;min-height:16px;padding:4px 0}
.form{padding:0 14px}
.form input,.form textarea,.sp input,.sp textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-size:15px;outline:none}
.form textarea,.sp textarea{resize:vertical;min-height:70px}
.pick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:16px;padding:14px;margin-bottom:10px;font-size:14px;cursor:pointer;text-align:left}

.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:16px;background:var(--pink);color:#fff;margin-top:6px;cursor:pointer;box-shadow:0 8px 20px rgba(214,36,110,.3)}

.umap{height:260px;border-radius:16px;overflow:hidden;margin:0 0 10px;background:#dfe4f5;position:relative;z-index:0}

.ubar{display:flex;gap:8px;margin:6px 0}.ubar input{flex:1;min-width:0}
.ugeo{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:12px;padding:0 12px;font-size:12px;cursor:pointer;white-space:nowrap}

.ulist button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.ulist .note{grid-column:1/-1}
html[data-theme="dark"] .ulist button,html[data-theme="dark"] .ugeo{background:rgba(26,30,72,.6);color:#ECEEFF}

.qs{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 10px}

.bub{border-radius:18px;padding:10px 13px;margin:0 14px 8px;font-size:14px;max-width:86%}

.contact{margin:0 14px;border-radius:20px;padding:14px;display:grid;gap:8px}

.steps{display:flex;gap:4px;margin:8px 0}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.d{background:var(--teal)}

.ban{margin:8px 0;font-size:13px}
.ban summary{cursor:pointer;color:var(--brand);font-weight:700}

.opt{display:flex;gap:8px;margin:10px 0}

.opt button.on{border-color:var(--teal)}
.opt button:disabled{opacity:.4;cursor:not-allowed}
.big{height:180px;border-radius:22px;display:grid;place-items:center;overflow:hidden}
.big img{width:100%;height:100%;object-fit:cover}
.big .ini{font-size:72px}
.gal{position:relative;height:270px;border-radius:22px;overflow:hidden}.gs{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.gs::-webkit-scrollbar{display:none}.gi{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;height:100%}.gi img,.gi video{width:100%;height:100%;object-fit:contain;background:transparent}.gd{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}.gd i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(37,48,143,.25);transition:width .25s}.gd i.on{width:16px;background:var(--brand)}.gc{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;border-radius:10px;padding:2px 8px;pointer-events:none}.gb{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.8);color:var(--brand);font-size:20px;font-weight:800;cursor:pointer;display:none}.gb.l{left:8px}.gb.r{right:8px}@media(hover:hover) and (pointer:fine){.gb{display:block}}
.copy{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-weight:700;background:rgba(255,255,255,.6)}
.copy button{border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.catsec{margin-bottom:6px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:22px 22px 0 0}
.nav button{flex:1;border:0;background:none;color:var(--mute);font-size:11px;padding:4px 0;cursor:pointer;position:relative}
.nav button svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.nav button.on{color:var(--brand);font-weight:700}
.nav i{position:absolute;top:0;right:26%;background:var(--pink);color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:0 6px}

.menu{position:absolute;top:0;left:0;bottom:0;width:min(300px,84%);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;border-radius:0 26px 26px 0;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.me{border-radius:20px;padding:16px;margin-bottom:12px;color:#fff;background:linear-gradient(120deg,#25308F,#16A3AE)}

.sp{transform:translateY(100%);transition:transform .35s cubic-bezier(.22,.8,.2,1)}
.sh.open .sp{transform:none}

.back{position:sticky;top:0;background:transparent;width:100%;text-align:left;border:0;color:var(--brand);font-size:16px;font-weight:700;padding:14px 0 10px;z-index:2;cursor:pointer}
.demo{background:rgba(233,168,0,.2);border-radius:12px;padding:8px 10px;font-size:13px;margin:8px 0}
.banners{overflow:hidden;padding:14px 14px 4px;scroll-snap-type:none}
.btrack{display:flex;transition:transform .7s cubic-bezier(.22,.8,.2,1);will-change:transform}

.pic{filter:saturate(.75)}
.ai{padding:12px 14px}
.fu{animation:fu .35s cubic-bezier(.22,.8,.2,1)}

.bub.me{background:var(--brand);color:#fff;margin:0 0 6px auto;max-width:80%;margin-left:auto;margin-right:0}
.bub.bot{background:rgba(255,255,255,.88);color:var(--ink);margin:0 auto 6px 0;max-width:80%;margin-right:auto;margin-left:0}

/* MacBook/AirPods/iPhone materiallari: aniqroq metall, to'g'ri aks va teksturalar */
function enhanceMaterials(obj) {
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m => {
      if (!m) return;
      ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap'].forEach(k => {
        if (m[k]) { m[k].anisotropy = maxAniso; m[k].needsUpdate = true; }
      });
      if (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) {
        m.envMapIntensity = 1.25;
        if (m.metalness > 0.5) m.roughness = Math.min(Math.max(m.roughness, 0.22), 0.4);
        m.needsUpdate = true;
      }
    });
  });
}

/* Teksturalarni qurilmaga mos o'lchamga kichraytirish (xotira va yuklanish yengillashadi, ko'rinish deyarli o'zgarmaydi) */
const TEX_MAX = WEAK ? 1024 : (matchMedia('(pointer: coarse)').matches ? 2048 : 4096);
function capTextures(obj) {
  if (TEX_MAX >= 4096) return;
  const seen = new Set();
  obj.traverse(o => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (!m) return;
      ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap'].forEach(k => {
        const t = m[k];
        if (!t || seen.has(t)) return;
        seen.add(t);
        const im = t.image;
        if (!im || !im.width) return;
        const s = TEX_MAX / Math.max(im.width, im.height);
        if (s >= 1) return;
        try {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.width * s));
          c.height = Math.max(1, Math.round(im.height * s));
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          t.image = c; t.needsUpdate = true;
        } catch (e) {}
      });
    });
  });
}

/* Modelni yuklash; bo'sh URL bo'lsa "yuklanmagan" deb belgilaydi */
function loadModel(rig, url) {
  const token = ++rig.loadToken;
  if (!url) {
    rig.failed = true; rig.loaded = false; rig.errMsg = 'Model hali yo\'q';
    clearHolder(rig);
    refreshLoader();
    return;
  }
  rig.failed = false;
  const src = (window.SARBON_MODELS && window.SARBON_MODELS[url]) || url;
  window.__dbg('GLB -> '+src);
  rig.pct = 0; rig.parsing = false; rig.mbL = 0; rig.mbT = 0;
  const onLoad = gltf => {
    window.__dbg('GLB OK '+src); rig._try = 0; rig.parsing = false;
    if (token !== rig.loadToken) return;
    clearHolder(rig);
    const obj = gltf.scene;
    obj.traverse(o => {
      if (o.isMesh) {
        o.frustumCulled = false;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => { if (m && m.map) m.map.anisotropy = maxAniso; });
      }
    });
    enhanceMaterials(obj);
    capTextures(obj);
    /* Markazlash: aylanish/masshtabsiz, toza lokal fazoda hisoblanadi */
    const tmp = new THREE.Group();
    tmp.add(obj);
    tmp.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(obj);
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    obj.position.sub(box.getCenter(new THREE.Vector3()));
    tmp.remove(obj);
    rig.holder.add(obj);
    rig.holder.scale.setScalar(0.7 / Math.max(sphere.radius, 1e-6));
    rig.loaded = true;
    refreshLoader();
  };
  const onErr = (err) => {
    window.__dbg('GLB FAIL '+src+' '+(err&&err.message||err||''));
    rig.parsing = false;
    if (token !== rig.loadToken) return;
    rig._try = (rig._try || 0) + 1;
    if (rig._try <= 4) { window.__dbg('retry '+rig._try); setTimeout(() => loadModel(rig, url), 2000 * rig._try); return; }
    rig.failed = true; rig.loaded = false;
    rig.errMsg = 'Model yuklanmadi. GitHub papkasidagi .glb fayl nomini tekshiring.';
    refreshLoader();
  };
  const onProg = (p, l, t) => {
    if (token !== rig.loadToken) return;
    rig.pct = p; rig.mbL = l; rig.mbT = t;
    if (rigs[active] === rig && !rig.loaded && !rig.failed) setLoaderText(rig);
    const k = src.slice(-12); window.__pl = window.__pl || {};
    if (p === 100 || !window.__pl[k] || Date.now() - window.__pl[k] > 1500) {
      window.__pl[k] = Date.now();
      window.__dbg('dl ' + k + ' ' + p + '% ' + (l/1048576).toFixed(1) + '/' + (t ? (t/1048576).toFixed(1) : '?') + 'MB');
    }
  };
  window.__glb.get(src, onProg).then(buf => {
    if (token !== rig.loadToken) return;
    rig.parsing = true;
    if (rigs[active] === rig) setLoaderText(rig);
    /* "tayyorlanmoqda" yozuvi chizilib olishi uchun biroz kutamiz */
    setTimeout(() => {
      if (token !== rig.loadToken) return;
      try { gltfLoader.parse(buf, '', onLoad, onErr); } catch (e) { onErr(e); }
    }, 30);
  }, onErr);
}

try {
  const ext = renderer.extensions;
  if (renderer.capabilities.isWebGL2 && (ext.has('EXT_color_buffer_float') || ext.has('EXT_color_buffer_half_float'))) {
    const msaa = ext.has('EXT_color_buffer_float') ? 4 : 0;
    const sceneRT = new THREE.WebGLRenderTarget(2, 2, {
      type: THREE.HalfFloatType, format: THREE.RGBAFormat,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      depthBuffer: true, samples: msaa
    });
    const vs = 'varying vec2 vUv;\nvoid main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
    const outMat = new THREE.ShaderMaterial({
      uniforms: { tex: { value: null }, uDir: { value: new THREE.Vector2(0, 0) } },
      vertexShader: vs,
      fragmentShader: ['uniform sampler2D tex;', 'uniform vec2 uDir;', 'varying vec2 vUv;',
        'void main(){',
        '  vec4 c = vec4(0.0);',
        '  for (int i = 0; i < 11; i++) {',
        '    float t = float(i) / 10.0 - 0.5;',
        '    c += texture2D(tex, vUv + uDir * t);',
        '  }',
        '  gl_FragColor = c / 11.0;',
        '  #include <tonemapping_fragment>', '  #include <colorspace_fragment>', '}'].join('\n'),
      depthTest: false, depthWrite: false, blending: THREE.NoBlending, toneMapped: true
    });
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), outMat);
    quad.frustumCulled = false;
    const qs = new THREE.Scene(); qs.add(quad);
    mb = { scene: sceneRT, qs, qcam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), outMat };
    mbOn = true;

/* Har bir modelning ekrandagi haqiqiy tezligi (piksel/kadr): siljish + aylanish (ω × r) */
const _qd = new THREE.Quaternion(), _qi = new THREE.Quaternion(), _rv = [0, 0];
function rigVel(r, sc) {
  _rv[0] = 0; _rv[1] = 0;
  const pv = r.pivot, q = r.spin.quaternion;
  if (!pv.visible) { r._pp = null; return _rv; }
  const R = 0.7 * sc;
  const cx = pv.position.x * sc, cy = pv.position.y * sc, rx = pv.rotation.x, ry = pv.rotation.y;
  if (r._pp) {
    _qi.copy(r._pq).invert(); _qd.copy(q).multiply(_qi);
    const s = _qd.w < 0 ? -2 : 2;
    _rv[0] = (cx - r._pp[0]) + s * _qd.y * R + (ry - r._pp[3]) * R;
    _rv[1] = (cy - r._pp[1]) - s * _qd.x * R - (rx - r._pp[2]) * R;
  } else r._pp = [0, 0, 0, 0];
  if (!r._pq) r._pq = new THREE.Quaternion();
  r._pq.copy(q);
  r._pp[0] = cx; r._pp[1] = cy; r._pp[2] = rx; r._pp[3] = ry;
  return _rv;
}

const AX_Y = new THREE.Vector3(0, 1, 0);
const AX_X = new THREE.Vector3(1, 0, 0);
function rotateSpin(rig, yaw, pitch) {
  const qy = new THREE.Quaternion().setFromAxisAngle(AX_Y, yaw);
  const qx = new THREE.Quaternion().setFromAxisAngle(AX_X, pitch);
  rig.spin.quaternion.premultiply(qy).premultiply(qx);
}
function markInteract() {
  lastInteract = performance.now();
  if (!hint.classList.contains('gone')) hint.classList.add('gone');
}

stage.addEventListener('pointerdown', e => {
  userAt = performance.now();
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  markInteract();
  if (pointers.size === 1) {
    drag = { x: e.clientX, y: e.clientY, t: performance.now() };
    stage.classList.add('drag');
    vYaw = vPitch = 0;
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
    pinchZoom = zoomT;
    drag = null;
  }
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const rig = rigs[active];
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchStart > 0) zoomT = clamp(pinchZoom * (d / pinchStart), 0.55, 3.4);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  const k = Math.PI / Math.max(260, camPX * 1.6);
  const yaw = dx * k, pitch = dy * k;
  rotateSpin(rig, yaw, pitch);
  const dt = Math.max(1e-3, (performance.now() - drag.t) / 1000);
  drag.t = performance.now();
  vYaw = yaw / dt * 0.016; vPitch = pitch / dt * 0.016;
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    drag = null;
    stage.classList.remove('drag');
  } else if (pointers.size === 1) {
    const [p] = [...pointers.values()];
    drag = { x: p.x, y: p.y, t: performance.now() };
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

stage.addEventListener('wheel', e => {
  e.preventDefault();
  markInteract();
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016));

}, { passive: false });

  zoomT = 1;

}

stage.addEventListener('keydown', e => {
  const rig = rigs[active];
  const step = 0.18;
  if (e.key === 'ArrowLeft') rotateSpin(rig, -step, 0);
  else if (e.key === 'ArrowRight') rotateSpin(rig, step, 0);
  else if (e.key === 'ArrowUp') rotateSpin(rig, 0, -step);
  else if (e.key === 'ArrowDown') rotateSpin(rig, 0, step);
  else if (e.key === '+' || e.key === '=') zoomT = clamp(zoomT * 1.2, 0.55, 3.4);
  else if (e.key === '-') zoomT = clamp(zoomT / 1.2, 0.55, 3.4);
  else if (e.key === '0') resetView();
  else return;
  e.preventDefault();
  markInteract();
});

function refreshLoader() {
  const rig = rigs[active];
  if (rig.loaded) {

const cardEl = $('.card');

function stopCardScroll() {
  if (cardRAF) { cancelAnimationFrame(cardRAF); cardRAF = 0; }

}
function autoScrollCard(delay) {
  stopCardScroll();
  cardEl.scrollTop = 0;
  if (reduce) return;
  cardTimer = setTimeout(() => {
    cardTimer = 0;
    const max = cardEl.scrollHeight - cardEl.clientHeight;
    if (max <= 4) return;
    const DUR = 3000, t0 = performance.now();
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const step = now => {
      const t = Math.min(1, (now - t0) / DUR);
      cardEl.scrollTop = max * ease(t);
      cardRAF = t < 1 ? requestAnimationFrame(step) : 0;
    };
    cardRAF = requestAnimationFrame(step);
  }, delay == null ? 350 : delay);
}

/* ---------- Kadr sikli ---------- */
let prev = performance.now();
let swayClock = 0;
let paused = false, rafOn = false, lastDraw = 0;
const COARSE = matchMedia('(pointer: coarse)').matches || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
let MIN_DT = COARSE ? 14 : 0;   /* ~60 fps (120Hz ekranda 60 bilan cheklanadi) */
function wake() {
  if (rafOn || paused || document.hidden) return;
  rafOn = true; prev = performance.now(); requestAnimationFrame(frame);
}
/* ---------- Vesper video fon: ko'rinmasa to'xtaydi (batareya va FPS uchun) ---------- */
const vsp = document.getElementById('vspVideo');
function vspSync() {
  if (!vsp) return;
  if (paused || document.hidden) { if (!vsp.paused) vsp.pause(); }
  else if (vsp.paused) { const p = vsp.play(); if (p && p.catch) p.catch(() => {}); }
}
if (vsp) {
  vsp.muted = true; vsp.defaultMuted = true; vsp.loop = true;
  ['loadeddata', 'canplay', 'stalled', 'suspend', 'pause'].forEach(ev => vsp.addEventListener(ev, vspSync));
  ['pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(ev => addEventListener(ev, vspSync, { passive: true }));
  vspSync();
  setInterval(function(){if(!document.hidden)vspSync()},1500);      /* brauzer o'zi to'xtatib qo'ysa ham qayta ishga tushadi */
}
addEventListener('message', e => {
  const d = e.data;
  if (d && d.b3d === 'vis') { paused = !d.v; if (!paused) wake(); vspSync(); }
});
document.addEventListener('visibilitychange', () => { wake(); vspSync(); document.documentElement.classList.toggle("pg-hidden", document.hidden); });

/* Moslashuvchan sifat: kadr sekinlashsa avval aniqlik biroz tushadi, keyin 30 fps ga o'tadi. Tezlashsa aniqlik qaytadi. */
let qCapDt = 0, qIdleDt = 0, qEma = 16.7, qSlow = 0, qFast = 0, qPR = 1, qHold = 0;
const PR_STEPS = [1, 0.85, 0.72, 0.6];
function setPR(i) { qPR = i; renderer.setPixelRatio(PR_STEPS[i]); resize(); }
let qI = 0;
function adaptQuality(now, dt) {
  if (now < qHold) return;
  const ms = dt * 1000;
  if (ms > 45) return;                                  /* tab almashganda sakrashlarni hisobga olmaymiz */
  qEma += (ms - qEma) * 0.06;
  const target = (qCapDt || qIdleDt) ? 33.3 : 16.7;
  if (qEma > target * 1.45) { qSlow++; qFast = 0; } else if (qEma < target * 1.15) { qFast++; qSlow = 0; } else { qSlow = 0; qFast = 0; }
  if (qSlow > 50) {
    qSlow = 0; qHold = now + 3000;
    if (qI < PR_STEPS.length - 1) { qI++; setPR(qI); }
    else if (!qCapDt) { qCapDt = 28; }
    qEma = target;
  } else if (qFast > 400 && qI > 0 && !qCapDt) {
    qFast = 0; qHold = now + 6000; qI--; setPR(qI); qEma = target;
  }
}

function frame(now) {
  if (paused || document.hidden) { rafOn = false; return; }
  qIdleDt = (COARSE && !anim && now - lastInteract > 5000) ? 28 : 0;   /* harakatsiz turganda 30 fps: CPU/batareya tejaladi */
  const _md = Math.max(MIN_DT, qCapDt, qIdleDt);
  if (_md && now - lastDraw < _md) { requestAnimationFrame(frame); return; }
  lastDraw = now;
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  adaptQuality(now, dt);
  swayClock += dt;

  /* Idle */
  const sinceInteract = (now - lastInteract) / 1000;
  const targetIdle = (!reduce && sinceInteract > 1.8) ? 1 : 0;
  idleAmt += (targetIdle - idleAmt) * (1 - Math.exp(-dt * (targetIdle ? 1 / 1.5 * 3 : 6)));

  /* Inersiya va navbat */
  const decay = Math.exp(-dt * 4.5);
  const rig = rigs[active];
  if (!drag && (Math.abs(vYaw) > 1e-4 || Math.abs(vPitch) > 1e-4)) {
    rotateSpin(rig, vYaw * dt * 60, vPitch * dt * 60);
    vYaw *= decay; vPitch *= decay;
  }
  if (Math.abs(queue) > 1e-4) {
    const step = queue * (1 - Math.exp(-dt * 4.2));
    rotateSpin(rig, step, 0);
    queue -= step;
  } else queue = 0;

  /* Ortga qaytarish (dblclick) */
  if (rig.resetting) {
    rig.spin.quaternion.slerp(new THREE.Quaternion(), 1 - Math.exp(-dt * 6));
    if (rig.spin.quaternion.angleTo(new THREE.Quaternion()) < 1e-3) rig.resetting = false;
  }

  /* Zoom */
  zoom += (zoomT - zoom) * (1 - Math.exp(-dt * 6));

  /* Tab animatsiyasi */
  for (const r of rigs) {
    if (r !== rigs[active] && !(anim && (anim.out === r))) {
      r.pivot.visible = r === rigs[active];
    }
    r.extraYaw = 0;
  }
  if (anim) {
    anim.t += dt / 0.78;
    const slide = stage.clientWidth * 1.25 / camPX;
    const { out, inn, dir, t } = anim;
    const te = Math.min(t / 0.6, 1);
    const eo = easeIn3(te);
    out.pivot.scale.setScalar(Math.max(1 - eo, 0.001));
    out.pivot.position.x = -dir * eo * slide;
    out.extraYaw = -dir * eo * 1.4;
    if (te >= 1) out.pivot.visible = false;
    const ti = Math.min(t, 1);
    const ei = easeOut3(ti);
    const s = outBack(ti) * (0.25 + 0.75 * ei);
    inn.pivot.scale.setScalar(Math.max(s, 0.001));
    inn.pivot.position.x = dir * (1 - ei) * slide;
    inn.extraYaw = dir * (1 - ei) * 1.6;
    if (t >= 1) {
      inn.pivot.scale.setScalar(1);
      inn.pivot.position.x = 0;
      inn.extraYaw = 0;
      out.pivot.visible = false;
      anim = null;
    }
  } else {
    rig.pivot.scale.setScalar(1);
    rig.pivot.position.x = 0;
  }

  /* Sichqoncha parallax: model sichqonchaga qarab biroz buriladi */
  px_ += (ptx - px_) * (1 - Math.exp(-dt * 3));
  py_ += (pty - py_) * (1 - Math.exp(-dt * 3));

  /* Model harakati: sayr va suzish */
  for (const r of rigs) {
    const sway = r === rigs[active] ? idleAmt : 0;
    r.pivot.rotation.y = Math.sin(swayClock * 0.55) * 0.16 * sway + r.extraYaw + px_ * 0.12;
    r.pivot.rotation.x = Math.sin(swayClock * 0.9) * 0.03 * sway + py_ * 0.06;
    r.pivot.position.y = reduce ? 0 : Math.sin(swayClock * 1.3 + r.idx) * 0.028;
  }

  /* Yorug'lik */
  const L = LIGHTS[lightMode ? 'dusk' : 'day'];
  const lf = 1 - Math.exp(-dt * 4);
  lightCur.env += (L.env - lightCur.env) * lf;
  lightCur.keyI += (L.keyI - lightCur.keyI) * lf;
  lightCur.rimI += (L.rimI - lightCur.rimI) * lf;
  lightCur.exp += (L.exp - lightCur.exp) * lf;
  lightCur.k.lerp(_kc.set(L.keyC), lf);
  scene.environmentIntensity = lightCur.env;
  key.intensity = lightCur.keyI;
  key.color.copy(lightCur.k);
  rim.intensity = lightCur.rimI;
  renderer.toneMappingExposure = lightCur.exp;

  /* Kadrlash: markaz va masofa */
  if (!HR) refreshRects();
  const hr = HR, sr = SR;
  let tcx, tcy, tpx;
  if (focusMode) {
    tcx = hr.width / 2;
    tcy = hr.height * 0.5;
    tpx = Math.min(hr.width * 0.5, hr.height * 0.6) * 1.16;
  } else {
    tcx = sr.left - hr.left + sr.width / 2;
    tcy = hr.height * 0.5;
    tpx = Math.min(sr.width * 0.5, sr.height * 0.6) * (hr.height <= 560 ? 1.0 : 1.16);
    if (hr.width <= 760) {
      const ir = document.querySelector('.info').getBoundingClientRect();
      const top = sr.top - hr.top;
      const avail = Math.max(140, ir.top - hr.top - top);
      tcy = top + avail * 0.5;
      tpx = Math.min(sr.width * 0.5, avail * 0.6) * 1.16;
    }
  }
  const a = 1 - Math.exp(-dt * 7);
  camCX += (tcx - camCX) * a;
  camCY += (tcy - camCY) * a;
  camPX += (tpx - camPX) * a;

  const W = hr.width, H = hr.height;
  camera.position.z = H / (2 * Math.tan(THREE.MathUtils.degToRad(FOV) / 2) * camPX * zoom);
  camera.setViewOffset(W, H, W / 2 - camCX, H / 2 - camCY, W, H);
  camera.updateProjectionMatrix();

  /* Motion blur: haqiqiy ekran tezligi bo'yicha */
  let blurPx = 0, bdx = 0, bdy = 0;
  if (mbOn) {
    const sc = camPX * zoom, nf = (1 / 60) / Math.max(dt, 1 / 240);
    let bx = 0, by = 0, bm = 0;
    for (const r of rigs) {
      const v = rigVel(r, sc);
      const m = Math.abs(v[0]) + Math.abs(v[1]);
      if (m > bm) { bm = m; bx = v[0]; by = v[1]; }
    }
    bx *= nf; by *= nf;
    if (Math.hypot(bx, by) < 0.35) { mbVX = 0; mbVY = 0; }          /* to'xtadi -> darhol tiniq */
    else { mbVX += (bx - mbVX) * 0.6; mbVY += (by - mbVY) * 0.6; }
    const SHUTTER = MB_STRENGTH;
    let lx = mbVX * SHUTTER, ly = mbVY * SHUTTER;
    const cap = Math.max(10, hr.width * 0.02), ll = Math.hypot(lx, ly);
    if (ll > cap) { lx *= cap / ll; ly *= cap / ll; }
    blurPx = Math.hypot(lx, ly);
    bdx = lx / hr.width; bdy = ly / hr.height;
    _avgMs += (Math.min(50, dt * 1000) - _avgMs) * 0.05;
    if (blurPx > 0.8 && ++_nFr > 40 && _avgMs > 26) { mbOn = false; mbOffAt = now; mbStrikes++; _nFr = 0; }
  } else if (mb && mbStrikes < 3 && now - mbOffAt > 5000) {
    mbOn = true; _avgMs = 16; _nFr = 0; mbVX = mbVY = 0;
  }
  if (mbOn && MB_STRENGTH > 0 && blurPx > 0.8) {
    try { renderMB(bdx, bdy); }
    catch (err) { mbOn = false; mbStrikes = 9; renderer.setRenderTarget(null); renderer.render(scene, camera); }
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}

/* ---------- Har 5 soniyada keyingi tovarga o'tish (matn 3 soniyada suriladi) ---------- */
setInterval(() => {
  if (paused || document.hidden || anim || drag || pointers.size) return;
  if (performance.now() - userAt < 6000) return;   /* foydalanuvchi tegsa, 6 soniya kutadi */
  const n = (active + 1) % rigs.length;
  if (!rigs[n].loaded && !rigs[n].failed) return;
  autoSwitching = true; selectProduct(n); autoSwitching = false;
}, 5000);

/* ---------- Ishga tushirish ---------- */
function init() {
  fillDetail(0, false);
  autoScrollCard(900);
  syncNav();
  refreshLoader();
  loadModel(rigs[0], modelUrlFor(rigs[0]));
  /* Qolgan mahsulotlarni fonda yuklash */
  /* Ketma-ket yuklash: avval 1-model tugasin, keyin keyingisi (sekin tarmoqda uzilmasligi uchun) */
  let qi = 1;
  const qt = setInterval(() => {
    if (qi >= rigs.length || SLOWNET) { clearInterval(qt); return; }
    const prev = rigs[qi - 1];
    if (!prev.loaded && !prev.failed) return;
    if (!rigs[qi].loaded && !rigs[qi].failed) loadModel(rigs[qi], modelUrlFor(rigs[qi]));
    qi++;
  }, 700);
  rafOn = true;
  requestAnimationFrame(frame);
}
typeSpecs(0);
init();

<script>
(function () {
  var root = document.documentElement;
  var glass = document.getElementById('glass');
  if (window.matchMedia('(pointer: coarse)').matches) return;
  var tx = -999, ty = -999, sx = -999, sy = -999, vx = 0, vy = 0, ang = 0, running = false;
  function kick() { if (!running) { running = true; requestAnimationFrame(loop); } }
  addEventListener('pointermove', function (e) { tx = e.clientX; ty = e.clientY; kick(); });
  function loop() {
    if (sx < -900) { sx = tx; sy = ty; }
    var px = sx, py = sy;
    sx += (tx - sx) * 0.1; sy += (ty - sy) * 0.1;
    root.style.setProperty('--mx', sx + 'px');
    root.style.setProperty('--my', sy + 'px');
    // Jiggle: tezlikka qarab cho'ziladi va buriladi, keyin asta qaytadi
    vx += ((sx - px) - vx) * 0.25;
    vy += ((sy - py) - vy) * 0.25;
    var speed = Math.min(Math.hypot(vx, vy), 60);
    var stretch = 1 + speed * 0.006;
    var squeeze = 1 / stretch;
    if (speed > 0.5) ang = Math.atan2(vy, vx) * 180 / Math.PI;
    if (glass) {
      glass.style.left = sx + 'px';
      glass.style.top = sy + 'px';
      glass.style.transform = 'translate(-50%,-50%) rotate(' + ang + 'deg) scale(' + stretch + ',' + squeeze + ') rotate(' + (-ang) + 'deg)';
    }
    if (Math.abs(tx - sx) < 0.4 && Math.abs(ty - sy) < 0.4 && speed < 0.4) { running = false; return; }
    requestAnimationFrame(loop);
  }
})();
<\/script>

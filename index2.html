<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25308F">
<title>Sarbon</title>
<style>
:root{--ink:#1B1D45;--mute:#5F6390;--brand:#25308F;--teal:#16A3AE;--pink:#D6246E;--gold:#E9A800;--line:rgba(37,48,143,.12);--r:20px;box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html{background:linear-gradient(165deg,#F1EEFF 0%,#E3F7F5 50%,#FFEAF2 100%) fixed;min-height:100%}
body{margin:0 auto;max-width:560px;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding:calc(116px + env(safe-area-inset-top,0px)) 0 calc(78px + env(safe-area-inset-bottom,0px));background:transparent;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(40px);z-index:-1;pointer-events:none}
body::before{width:280px;height:280px;background:rgba(214,36,110,.12);top:-60px;right:-80px}
body::after{width:300px;height:300px;background:rgba(22,163,174,.12);bottom:-80px;left:-100px}
button,input,select,textarea{font:inherit}
.glass{background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 30px rgba(37,48,143,.10)}
.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:calc(112px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;display:flex;align-items:center;gap:10px;z-index:5;border-radius:0 0 22px 22px}
.logo{flex:1;font-weight:900;font-size:22px;letter-spacing:.3px}
.logo b{color:var(--pink)}.logo span{color:var(--teal)}
.ib{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);color:var(--ink);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;position:relative;cursor:pointer;flex:0 0 42px}
.ib svg{width:21px;height:21px}
.ib i{position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.atlas{position:fixed;top:112px;left:50%;transform:translateX(-50%);width:min(560px,100%);height:5px;z-index:5;background:repeating-linear-gradient(90deg,#D6246E 0 16px,#25308F 16px 32px,#16A3AE 32px 48px,transparent 48px 52px)}
.search{margin:14px 14px 0;border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:8px}
.search input{flex:1;border:0;background:none;color:var(--ink);padding:13px 0;font-size:15px;outline:none}
.banners{display:flex;gap:12px;overflow-x:auto;padding:14px 14px 4px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.banners::-webkit-scrollbar{display:none}
.bn{flex:0 0 88%;scroll-snap-align:start;border-radius:24px;padding:20px;color:#fff;min-height:136px;position:relative;overflow:hidden;background:linear-gradient(120deg,#25308F,#16A3AE);box-shadow:0 10px 26px rgba(37,48,143,.25)}
.bn.b2{background:linear-gradient(120deg,#D6246E,#E9A800)}
.bn.b3{background:linear-gradient(120deg,#16A3AE,#2E9E5B)}
.bn h2{margin:0 0 4px;font-size:19px;max-width:80%}
.bn p{margin:0;font-size:13px;opacity:.92;max-width:80%}
.bn .pat{position:absolute;right:-6px;bottom:-16px;font-size:92px;opacity:.25}
.dots{display:flex;gap:6px;justify-content:center;padding:6px 0 0}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(37,48,143,.25);transition:width .4s}
.dots i.on{width:18px;background:var(--brand)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;padding:16px 14px 4px}
.cat{border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:0}
.cat span{width:58px;height:58px;border-radius:22px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.cat svg{width:28px;height:28px}
.ai{margin:16px 14px 0;border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border:0;width:calc(100% - 28px);text-align:left;color:var(--ink)}
.ai .bo{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,#25308F,#D6246E);display:grid;place-items:center;color:#fff;flex:0 0 44px}
.ai b{display:block;font-size:15px}
.ai small{color:var(--mute);font-size:12px}
.sec{font-size:17px;margin:22px 14px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-size:12px;color:var(--brand);font-weight:700}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 14px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .card{flex:0 0 150px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.card{border-radius:var(--r);overflow:hidden;position:relative;cursor:pointer;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);box-shadow:0 6px 20px rgba(37,48,143,.08)}
.pic{height:124px;display:grid;place-items:center;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.ini{font-size:44px;font-weight:900;color:rgba(27,29,69,.22)}
.badge{position:absolute;left:8px;top:8px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:2px 7px}
.heart{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:var(--pink);font-size:15px;cursor:pointer}
.in{padding:10px 11px 12px}
.in .n{font-size:13px;font-weight:600;height:36px;overflow:hidden}

.sortbar{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.sortbar button{border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--ink);border-radius:14px;padding:7px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.sortbar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.mut{color:var(--mute);padding:20px 14px;text-align:center}
.list{padding:0 14px}
.row{display:flex;gap:10px;align-items:center;border-radius:18px;padding:10px;margin-bottom:10px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7)}

.q{display:flex;align-items:center;gap:6px}
.q button{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);cursor:pointer}
.sum{border-radius:20px;padding:12px 14px;margin:0 14px 12px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7)}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;color:var(--mute)}
.ln b{color:var(--ink)}
.ln.t{color:var(--ink);font-weight:800;font-size:17px}
.note{font-size:12px;color:var(--mute);padding:4px 0}
.err{color:var(--pink);font-size:13px;min-height:16px;padding:4px 0}
.form{padding:0 14px}
.form input,.form textarea,.sp input,.sp textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-size:15px;outline:none}
.form textarea,.sp textarea{resize:vertical;min-height:70px}
.pick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:16px;padding:14px;margin-bottom:10px;font-size:14px;cursor:pointer;text-align:left}
.pick span{color:var(--mute)}
.pick b{flex:1;text-align:right;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:16px;background:var(--pink);color:#fff;margin-top:6px;cursor:pointer;box-shadow:0 8px 20px rgba(214,36,110,.3)}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid var(--line);margin-top:8px;box-shadow:none}

.tmap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tmap button{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:12px;padding:10px 4px;font-size:12px;cursor:pointer}
.tmap button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.qs{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 10px}
.qs button{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:14px;padding:8px 12px;font-size:13px;cursor:pointer}
.bub{border-radius:18px;padding:10px 13px;margin:0 14px 8px;font-size:14px;max-width:86%}
.bub.bot{background:rgba(255,255,255,.7)}

.contact{margin:0 14px;border-radius:20px;padding:14px;display:grid;gap:8px}
.contact a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);font-weight:700;background:rgba(255,255,255,.6);border-radius:14px;padding:12px 14px}
.contact a small{color:var(--mute);font-weight:500}
.steps{display:flex;gap:4px;margin:8px 0}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.d{background:var(--teal)}
.warn{background:rgba(214,36,110,.12);color:var(--pink);border-radius:12px;padding:9px 11px;font-size:13px;margin:8px 0}
.ban{margin:8px 0;font-size:13px}
.ban summary{cursor:pointer;color:var(--brand);font-weight:700}
.ban ul{margin:4px 0;padding-left:18px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:8px 0}
.ck input{width:auto;margin:3px 0 0}
.opt{display:flex;gap:8px;margin:10px 0}
.opt button{flex:1;border:2px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);border-radius:16px;padding:10px;text-align:left;font-size:13px;cursor:pointer}
.opt button.on{border-color:var(--teal)}
.opt button:disabled{opacity:.4;cursor:not-allowed}
.big{height:180px;border-radius:22px;display:grid;place-items:center;overflow:hidden}
.big img{width:100%;height:100%;object-fit:cover}
.big .ini{font-size:72px}
.copy{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-weight:700;background:rgba(255,255,255,.6)}
.copy button{border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.catsec{margin-bottom:6px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:22px 22px 0 0}
.nav button{flex:1;border:0;background:none;color:var(--mute);font-size:11px;padding:4px 0;cursor:pointer;position:relative}
.nav button svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.nav button.on{color:var(--brand);font-weight:700}
.nav i{position:absolute;top:0;right:26%;background:var(--pink);color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:0 6px}
.ov{position:fixed;inset:0;background:rgba(10,12,40,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.ov.open{opacity:1;pointer-events:auto}
.ov .menu{transform:translateX(-105%);transition:transform .32s cubic-bezier(.22,.8,.2,1)}
.ov.open .menu{transform:none}
.menu{position:absolute;top:0;left:0;bottom:0;width:min(300px,84%);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;border-radius:0 26px 26px 0;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.me{border-radius:20px;padding:16px;margin-bottom:12px;color:#fff;background:linear-gradient(120deg,#25308F,#16A3AE)}
.me h3{margin:0 0 4px;font-size:17px}
.me p{margin:0;font-size:13px;opacity:.9}
.me button{margin-top:10px;background:#fff;color:var(--brand);border:0;border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer}
.menu button.li{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);padding:13px 4px;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.menu button.li b{width:10px;height:10px;border-radius:4px;display:inline-block}
.sh{position:fixed;inset:0;background:rgba(10,12,40,.4);display:flex;opacity:0;pointer-events:none;transition:opacity .25s;align-items:flex-end;justify-content:center;z-index:10}
.sh.open{opacity:1;pointer-events:auto}
.sp{transform:translateY(100%);transition:transform .35s cubic-bezier(.22,.8,.2,1)}
.sh.open .sp{transform:none}
.sp{width:min(560px,100%);max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(240,240,252,.9);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.back{position:sticky;top:0;background:transparent;width:100%;text-align:left;border:0;color:var(--brand);font-size:16px;font-weight:700;padding:14px 0 10px;z-index:2;cursor:pointer}
.demo{background:rgba(233,168,0,.2);border-radius:12px;padding:8px 10px;font-size:13px;margin:8px 0}
.banners{overflow:hidden;padding:14px 14px 4px;scroll-snap-type:none}
.btrack{display:flex;transition:transform .7s cubic-bezier(.22,.8,.2,1);will-change:transform}
.btrack .bn{flex:0 0 100%;box-sizing:border-box;margin:0;min-height:128px;box-shadow:0 8px 22px rgba(37,48,143,.18)}
.bn{background-size:140% 140%;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0% 50%}to{background-position:100% 50%}}
.pic{filter:saturate(.75)}
.ai{padding:12px 14px}
.fu{animation:fu .35s cubic-bezier(.22,.8,.2,1)}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aibox{margin:0 14px;border-radius:18px;padding:10px}
.ailog{max-height:200px;overflow-y:auto;padding:2px 0}
.ailog .bub{margin:0 0 6px;max-width:90%}
.aich{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.aich button{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:12px;padding:6px 10px;font-size:12px;cursor:pointer}
.aiin{display:flex;gap:6px}
.aiin input{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:12px;padding:9px 12px;font-size:14px;outline:none;margin:0}
.aiin button{border:0;background:var(--brand);color:#fff;border-radius:12px;width:44px;cursor:pointer;font-size:16px}
.deal{position:relative}
.deal s{font-size:11px;color:var(--mute);font-weight:500}
details.op{margin:0 14px;border-radius:16px;padding:10px 14px}
details.op summary{cursor:pointer;font-weight:700;color:var(--brand)}
.fab{position:fixed;right:14px;bottom:86px;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#25308F,#D6246E);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(214,36,110,.35);animation:breath 2.6s ease-in-out infinite;cursor:pointer;z-index:7;transition:opacity .2s,transform .2s}
.fab.hid{opacity:0;pointer-events:none;transform:scale(.8)}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.apanel{position:fixed;right:12px;bottom:152px;width:min(340px,calc(100% - 24px));opacity:0;pointer-events:none;transform:scale(.94) translateY(12px);transform-origin:bottom right;transition:opacity .25s,transform .3s cubic-bezier(.22,.8,.2,1);z-index:8}
.apanel.open{opacity:1;pointer-events:auto;transform:none}
.apin{margin:0;border-radius:22px;padding:12px}
.apin .ailog{max-height:280px}
.aihd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.aihd b{display:block;font-size:14px}
.aihd small{color:var(--mute);font-size:11px}
.aihd .dot{width:10px;height:10px;border-radius:50%;background:#2E9E5B;animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(46,158,91,.6)}70%{box-shadow:0 0 0 8px rgba(46,158,91,0)}100%{box-shadow:0 0 0 0 rgba(46,158,91,0)}}
.xb{margin-left:auto;border:0;background:rgba(255,255,255,.7);width:30px;height:30px;border-radius:10px;font-size:18px;cursor:pointer;color:var(--ink)}
.aibox .ailog.tall{max-height:340px}
.bub.me{background:var(--brand);color:#fff;margin:0 0 6px auto;max-width:80%;margin-left:auto;margin-right:0}
.bub.bot{background:rgba(255,255,255,.88);color:var(--ink);margin:0 auto 6px 0;max-width:80%;margin-right:auto;margin-left:0}
.a-bar{animation:bar 1.4s ease-in-out infinite}
@keyframes bar{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.a-cur{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.a-head{animation:bob 1.6s ease-in-out infinite}

.a-shirt{transform-origin:12px 4px;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.a-door{transform-origin:10px 20px;animation:door 3.2s ease-in-out infinite}
@keyframes door{0%,25%{transform:scaleX(1)}45%,80%{transform:scaleX(.2)}100%{transform:scaleX(1)}}
.a-s1,.a-s2{animation:smoke 2.2s ease-out infinite}
.a-s2{animation-delay:1.1s}
@keyframes smoke{0%{opacity:0;transform:translateY(4px) scale(.6)}40%{opacity:1}100%{opacity:0;transform:translateY(-7px) scale(1.5)}}
.a-drop{animation:bob 2s ease-in-out infinite}
.a-spark{transform-origin:19px 5px;animation:tw 1.6s ease-in-out infinite}

.a-spin{transform-origin:12px 12px;animation:spin 3s linear infinite}

.cat:active span{transform:scale(.94)}
.nav{padding:6px;border-radius:30px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 20px));background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.55);box-shadow:0 12px 32px rgba(37,48,143,.18),inset 0 1px 0 rgba(255,255,255,.75)}
.navb{position:relative;z-index:1;display:flex;width:100%}
.nav button{border-radius:22px;padding:7px 0 6px;transition:color .3s}
.nav button svg{transition:transform .7s cubic-bezier(.25,.9,.3,1)}
.nav button:active svg{transform:scale(.85)}
.nav button.on svg{transform:translateY(-1px) scale(1.06)}
.pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:24px;background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 16px rgba(37,48,143,.16),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(37,48,143,.06);transition:left 1s cubic-bezier(.25,.9,.3,1),width .9s cubic-bezier(.25,.9,.3,1);z-index:0;pointer-events:none}
.ailog{display:flex;flex-direction:column;height:300px;overflow-y:auto;padding:4px 2px;scroll-behavior:smooth;overscroll-behavior:contain}
.ailog::before{content:"";flex:1 0 0}
.apin .ailog{height:300px;max-height:none}
.aibox .ailog.tall{height:190px;max-height:none}
.bub.in{animation:msgIn .45s cubic-bezier(.22,.9,.3,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.bub.typing{display:flex;gap:4px;align-items:center;width:auto;padding:12px 14px;animation:msgIn .3s ease both}
.bub.typing i{width:6px;height:6px;border-radius:50%;background:#fff;display:block;animation:tdot 1s infinite ease-in-out}
.bub.typing i:nth-child(2){animation-delay:.15s}
.bub.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.frond{transition:stroke 1.2s ease}

html[data-season="au"] .frond{stroke:#7A8F3A}

.bush{display:none!important}

.scrollers use{transition:filter 1.2s}
html[data-season="wi"] .scrollers use{filter:saturate(.3) brightness(1.15)}
html[data-season="au"] .scrollers use{filter:saturate(.8) hue-rotate(-12deg)}

.palms{animation:lmv 40s linear infinite}
html[data-season="su"] .wm{transform:rotate(-7deg) translateY(-18px)!important}
.mscroll{animation:lmv 40s linear infinite!important}
.snowscroll{animation:lmv 40s linear infinite!important;opacity:0;transition:opacity 1.2s ease}
html[data-season="wi"] .snowscroll{opacity:1}
.kfly{animation:kfly 50s linear infinite}
@keyframes kfly{from{transform:translateX(380px)}to{transform:translateX(-200px)}}
html[data-season="sp"] .deco-su{opacity:1}
.cap.gone{animation:capGone 3s ease-in forwards!important}
@keyframes capGone{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(190px,-130px) rotate(700deg);opacity:0}}
.roadscroll{animation:roadlm 80s linear infinite!important}

.top>.road{z-index:-1!important}

.rdirt{transition:fill 1.2s ease}
html[data-season="wi"] .rdirt{fill:#E9F0F8}
html[data-theme="dark"] .rdirt{fill:#4A3A28}
/* calm, even camel gait that matches the ground speed */
.lg{animation:leg 1.2s ease-in-out infinite!important;transform-box:fill-box;transform-origin:50% 0}
.l1,.l4{animation-delay:0s!important}
.l2,.l3{animation-delay:-.6s!important}
@keyframes leg{0%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}100%{transform:rotate(-16deg)}}
.cbody{animation:bob .6s ease-in-out infinite alternate!important}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1px)}}
.springground{animation:lmv 40s linear infinite!important;opacity:0;transition:opacity 1s ease}

.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gsway 2.4s ease-in-out infinite alternate}

html[data-season="sp"] .ground{fill:#7DBE5A!important}

.top{background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:0!important;overflow:visible}
.sky{border-radius:0!important;overflow:hidden;-webkit-mask-image:linear-gradient(#000 78%,transparent 100%);mask-image:linear-gradient(#000 78%,transparent 100%)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-26px;height:38px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.22));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none;z-index:0}
html[data-theme="dark"] .top::after{background:linear-gradient(rgba(20,24,60,0),rgba(20,24,60,.3))}
/* lighter blur everywhere so the ground stays visible */
.glass,.menu,.sp{-webkit-backdrop-filter:blur(4px) saturate(120%)!important;backdrop-filter:blur(4px) saturate(120%)!important}
.sky{-webkit-mask-image:none!important;mask-image:none!important}
.top::after{display:none!important}
/* page changes: soft fade with a slight blur and motion, not an instant swap */
.fu{animation:fuSoft .6s cubic-bezier(.2,.7,.2,1) both!important}
@keyframes fuSoft{from{opacity:0;filter:blur(8px);transform:translateY(14px) scale(.985)}to{opacity:1;filter:blur(0);transform:none}}
.sp{padding-bottom:110px!important;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.sh{transition:opacity .35s ease!important}
.sh .sp>*:not(.back){animation:spIn .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes spIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.btrack{transition:transform .9s cubic-bezier(.22,.8,.2,1)!important}
.bn.b4{background:linear-gradient(120deg,#0E7C86,#2E6FB8)!important}
.bn.b5{background:linear-gradient(120deg,#E9A800,#D6246E)!important}
.dots i{transition:width .6s ease,background .6s ease}
/* season changes fade over 3 seconds */
.sky path,.sky stop,.tree path,.cnp,.cnp2 circle,.ground,.rdirt,.sak2,.bush,.field,.fields,.springground,.snowscroll,.whirl,.cap,.bird,.deco,.top>.road,.top>.road::after,.mtn1,.mtn2,.sc,.frond,#snow{transition-duration:3s!important}
.dots i.on{width:18px}
.bn{min-height:112px!important;padding:14px 16px!important;border-radius:20px!important}
.bn h2{font-size:17px!important}
.bn p{font-size:12px!important}
.bn .pat{font-size:72px!important}
/* the topic emoji sit behind each banner's text again, clearly visible */
.bn .pat{font-size:104px!important;opacity:.55!important;right:-6px!important;bottom:-22px!important;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18));line-height:1;transform:rotate(-8deg)}
/* season change: a soft band of light sweeps across the scene and joins the old season to the new one */
.top>.seasonwave{position:absolute!important;top:-12%;bottom:-12%;left:-80%;width:70%;z-index:2;pointer-events:none;transform:skewX(-16deg);filter:blur(10px);opacity:0}
.top>.seasonwave.run{animation:swp 3s cubic-bezier(.35,.1,.25,1) forwards}
.seasonwave.t-sp{background:linear-gradient(90deg,transparent,rgba(255,214,235,.75),rgba(255,255,255,.5),transparent)}
.seasonwave.t-su{background:linear-gradient(90deg,transparent,rgba(255,236,170,.8),rgba(255,255,255,.45),transparent)}
.seasonwave.t-au{background:linear-gradient(90deg,transparent,rgba(255,190,110,.7),rgba(255,226,170,.45),transparent)}
.seasonwave.t-wi{background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),rgba(220,235,255,.5),transparent)}
@keyframes swp{0%{left:-80%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:120%;opacity:0}}
/* banners: centred, the same width as the page margins, one per slide */
.banners{overflow:hidden!important;padding:14px 0 4px!important}
.btrack{width:100%!important;display:flex!important}
.btrack .bn{width:calc(100% - 28px)!important;flex:0 0 calc(100% - 28px)!important;margin:0 14px!important;box-sizing:border-box!important}
.top>.seasonwave{width:70%}
.seasonwave.t-wi{box-shadow:0 0 60px 30px rgba(255,255,255,.4)}

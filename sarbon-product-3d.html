<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarbon 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 12px;
  background: #f3f4f6;
  color: #111827;
  font-family: Arial, sans-serif;
}
h1 {
  text-align: center;
  margin: 20px 0;
}
.products {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  max-width: 1400px;
  margin: auto;
}
.card {
  min-width: 0;
  background: white;
  border-radius: 12px;
  padding: 8px;
  text-align: center;
}
model-viewer {
  display: block;
  width: 100%;
  height: 300px;
  background: #e5e7eb;
  border-radius: 10px;
}
h2 {
  font-size: 16px;
}
@media (max-width: 600px) {
  body {
    padding: 6px;
  }
  .products {
    gap: 5px;
  }
  .card {
    padding: 4px;
  }
  model-viewer {
    height: 180px;
  }
  h1 {
    font-size: 20px;
  }
  h2 {
    font-size: 11px;
  }
}
</style>
</head>
<body>
<h1>Sarbon — 3D mahsulotlar</h1>
<div class="products">
<div class="card">
<model-viewer
src="./airpods_pro_3.glb"
camera-controls
auto-rotate
alt="AirPods Pro 3">
</model-viewer>
<h2>AirPods Pro 3</h2>
</div>
<div class="card">
<model-viewer
src="./iphone_18_pro_max.glb"
camera-controls
auto-rotate
alt="iPhone 18 Pro Max">
</model-viewer>
<h2>iPhone 18 Pro Max</h2>
</div>
<div class="card">
<model-viewer
src="./macbook_pro_m3_16_inch_2024.glb"
camera-controls
auto-rotate
alt="MacBook Pro M3">
</model-viewer>
<h2>MacBook Pro M3</h2>
</div>
</div>
</body>
</html>
